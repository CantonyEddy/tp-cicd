groups:
  - name: tp-cicd
    rules:
      - alert: ContainerDown
        expr: absent(container_memory_usage_bytes{name="tp-cicd-app-1"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Le conteneur app est down"

      - alert: HighMemory
        expr: container_memory_usage_bytes{name="tp-cicd-app-1"} > 100000000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire app > 100MB"

      - alert: HighCPU
        expr: rate(container_cpu_usage_seconds_total{name="tp-cicd-app-1"}[1m]) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CPU app > 50%"